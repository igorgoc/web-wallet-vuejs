name: Deploy Web Wallet to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Enforce least-privilege permissions for GitHub Pages deployment
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Verify TypeScript Types
        run: npm run type-check

      - name: Run Cryptographic & Security Unit Tests
        run: npm run test:unit

      - name: Build Web Wallet for GitHub Pages
        run: npx cross-env VITE_NODE_ENV=staging NODE_OPTIONS=--max-old-space-size=4096 vite build --base ./

      - name: Run Performance Budget & Benchmark Check
        run: npm run test:perf

      - name: Verify Artifact Integrity & Security Headers
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ ERROR: dist/index.html was not generated!"
            exit 1
          fi
          if ! grep -q "Content-Security-Policy" dist/index.html; then
            echo "❌ ERROR: Content-Security-Policy meta tag missing from dist/index.html!"
            exit 1
          fi
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          echo "✅ Integrity check passed: dist/index.html verified with CSP, .nojekyll and 404 fallback created."

      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
